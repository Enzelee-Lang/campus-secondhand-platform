spring.application.name=campus-backend
server.port=8080

# ===== 请求体大小限制（允许大 Base64 图片）=====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=52428800
server.tomcat.max-http-form-post-size=52428800

# ===== 错误详情 =====
server.error.include-exception=true
server.error.include-message=always
server.error.include-stacktrace=always
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ===== Jackson =====
spring.jackson.max-in-memory-size=50MB

# ===== MySQL =====
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/campus_second_hand?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
# 表已存在,不自动改表结构
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== JSON 时区 =====
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

# ===== 接口文档 =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
